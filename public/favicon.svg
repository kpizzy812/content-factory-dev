<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Контент-Завод: три вертикальных кадра (9:16 — формат роликов) на ленте
       конвейера. Деталей ровно столько, сколько выживает при 16px: кадры шириной
       3px и зазором 1px в итоговом растре, лента отдельной массой ниже. -->
  <rect width="32" height="32" rx="7" fill="#0c0e10"/>
  <g fill="#f0a63c">
    <rect x="5" y="6" width="6" height="12" rx="1"/>
    <rect x="13" y="6" width="6" height="12" rx="1" fill="#f8b757"/>
    <rect x="21" y="6" width="6" height="12" rx="1"/>
  </g>
  <rect x="3" y="22" width="26" height="3" rx="1.5" fill="#b07d24"/>
</svg>
